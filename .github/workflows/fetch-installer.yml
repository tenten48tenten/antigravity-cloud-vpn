name: Fetch Tailscale MSI

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tailscale MSI
        run: |
          curl -fSL -o tailscale-setup-1.104.7.msi https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi
          ls -lh tailscale-setup-1.104.7.msi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-msi
          path: tailscale-setup-1.104.7.msi